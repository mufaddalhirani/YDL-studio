name: Bug report
description: Something in YDL Studio is not behaving
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Site-specific download failures are usually yt-dlp problems rather than app
        problems. Try `pip install -U yt-dlp` (or the latest release build) first and
        say whether that changed anything.
  - type: input
    id: version
    attributes:
      label: YDL Studio version
      description: Shown at the bottom of the sidebar.
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps you took, what you expected, what you got instead.
      placeholder: |
        1. Pasted a playlist link
        2. Set quality to 1080p and pressed Add to queue
        3. Expected 12 files, got 1
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console or log output
      description: Copy from the Console tab, or the tail of the newest file in Settings → Output → Folders → Logs.
      render: shell
  - type: dropdown
    id: install
    attributes:
      label: How are you running the app?
      options:
        - Release executable
        - pip install from source
        - python -m ydl_studio
    validations:
      required: true
